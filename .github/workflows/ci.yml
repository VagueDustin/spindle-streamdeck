name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history so the scrub can check every commit's author and committer email.
      # No token left in .git/config for install scripts or build tools to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm run scrub
      # The locked @elgato/cli devDependency, never a fresh download from npm.
      # Warnings (such as the manifest URL returning 404 before the repo is public) exit 0; only errors fail.
      - run: npm run validate -- --no-update-check

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Full history so the scrub can check every commit's author and committer email.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm run scrub
      # Warnings (such as the manifest URL returning 404 before the repo is public) exit 0; only errors fail.
      - run: npx @elgato/cli@1.10 validate com.vaguedustin.spindle.sdPlugin --no-update-check

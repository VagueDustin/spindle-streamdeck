name: Release

on:
  push:
    tags:
      - "v*"

# Every job starts read-only; only the publish job, which runs no project code, can write.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history so the scrub can check every commit's author and committer email.
      # No token left in .git/config for install scripts or build tools to read.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The Marketplace keys on the manifest Version: tag v1.2.3 must ship Version 1.2.3.0 (run `npm version` first).
      - name: Check the tag matches the manifest Version
        run: |
          expected="${GITHUB_REF_NAME#v}.0"
          actual="$(node -p 'require("./com.vaguedustin.spindle.sdPlugin/manifest.json").Version')"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} needs manifest Version ${expected}, but it is ${actual}. Run npm version before tagging."
            exit 1
          fi
          echo "manifest Version ${actual} matches tag ${GITHUB_REF_NAME}"
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx vitest run
      - run: npm run build
      - run: npm run scrub
      # The locked @elgato/cli devDependency, never a fresh download from npm.
      - run: npm run validate -- --no-update-check
      - run: npx --no-install streamdeck pack com.vaguedustin.spindle.sdPlugin --output out --force --no-update-check
      - name: Name the asset Spindle.streamDeckPlugin
        run: |
          shopt -s nullglob
          packed=(out/*.streamDeckPlugin)
          if [ "${#packed[@]}" -ne 1 ]; then
            echo "expected exactly one packed plugin in out/, found ${#packed[@]}" >&2
            ls -la out >&2
            exit 1
          fi
          if [ "${packed[0]}" != "out/Spindle.streamDeckPlugin" ]; then
            mv "${packed[0]}" out/Spindle.streamDeckPlugin
          fi
          ls -la out
      - name: Extract release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="out/release-notes.md"
          if [ -f CHANGELOG.md ]; then
            # Lines under the "## [x.y.z]" (or "## x.y.z") heading that matches the tag, up to the next "## ".
            awk -v v="$version" '
              /^## / {
                if (found) exit
                h = $0
                sub(/^## +\[?v?/, "", h)
                c = substr(h, length(v) + 1, 1)
                if (index(h, v) == 1 && (c == "" || c == "]" || c == " ")) found = 1
                next
              }
              found
            ' <(tr -d '\r' < CHANGELOG.md) > "$notes"
          fi
          if ! grep -q '[^[:space:]]' "$notes" 2>/dev/null; then
            echo "See CHANGELOG.md" > "$notes"
          fi
          cat "$notes"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: |
            out/Spindle.streamDeckPlugin
            out/release-notes.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout and no npm: this job only uploads what the build job produced.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: out
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: out/Spindle.streamDeckPlugin
          body_path: out/release-notes.md
